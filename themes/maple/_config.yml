# ==========================================
# Maple 主题配置文件
# ==========================================

# 导航栏配置
nav:
  Home: /
  Archives: /archives
  Categories: /categories
  Tags: /tags

# 网站图标和Logo
favicon: /favicon.ico
logo: /images/logo.svg

# 社交链接
links:
  Github: https://github.com/williamxiewz
  # ZhiHu:
  # Twitter:
  # Weibo:

# 统计代码
google_analytics: G-YJNSKK28WG
baidu_analytics:

# Google Adsense
adsense:
  enable: true       # 是否启用Adsense广告
  client: ca-pub-1663357848309469  # 发布商ID
  slot:             # 广告位ID (可选，用于自动广告)
  article_ads: true # 是否在文章中显示广告

# 功能开关
fancybox: true        # 图片查看器
mathjax: true         # 数学公式支持
echarts: true         # 图表库支持
busuanzi: true        # 访问统计

# Mermaid 图表支持
mermaid:
  enable: true
  # 可用主题: default | dark | forest | neutral
  theme: default

# Giscus 评论系统
giscus:
  enable: false      # 是否启用
  repo:             # GitHub 仓库 (格式: username/repo)
  repo_id:          # 仓库 ID
  category:         # 讨论分类
  category_id:      # 分类 ID
  mapping:          # 页面映射方式 (pathname | url | title | og:title)

# Maple 主题特效
maple:
  enable: true
  count: 10         # 落叶数量
  speed: 0.5        # 落叶速度 (0-1)

