# ==========================================
# Hexo 主配置文件
# 文档: https://hexo.io/docs/configuration.html
# 源码: https://github.com/hexojs/hexo/
# ==========================================

# ==========================================
# 站点基本信息
# ==========================================
title: William's Blog
subtitle: Walk steps step by step
description: 'William Xie 的个人技术博客，专注 iOS 开发、音视频技术、云计算等技术分享'
keywords: 'iOS开发,音视频技术,云计算,Swift,技术博客'
author: William Xie
language: zh-CN
timezone: 'Asia/Shanghai'

# ==========================================
# URL 配置
# ==========================================
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://williamxiewz.github.io
root: /
permalink: /post/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# ==========================================
# 目录配置
# ==========================================
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - CNAME
  - README.md

# ==========================================
# 写作配置
# ==========================================
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: true
  preprocess: true
  line_number: true
  tab_replace: ''

# ==========================================
# 首页设置
# ==========================================
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 档案页面配置
archive_generator:
  per_page: 10  # 每页显示10篇文章
  yearly: true
  monthly: true
  daily: false

# ==========================================
# 分类和标签配置
# ==========================================
default_category: uncategorized
category_map:
  iOS SDK: iOS-SDK
  cloud computing: cloud-computing
tag_map:

# ==========================================
# 元数据和SEO配置
# ==========================================
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: false

# SEO 优化
seo: true

# ==========================================
# 订阅和站点地图
# ==========================================
# RSS 订阅
feed:
  type: atom
  path: atom.xml
  limit: 20

# 站点地图
sitemap:
  path: sitemap.xml

# ==========================================
# 日期和时间格式
# ==========================================
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# ==========================================
# 分页配置
# ==========================================
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# ==========================================
# 文件包含/排除配置
# ==========================================
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# ==========================================
# 性能优化配置
# ==========================================
minify: true

# 图片优化配置
image_minifier:
  enable: true
  interlaced: false
  multipass: false
  optimizationLevel: 3
  pngquant: false
  progressive: false
  quality: 80
  svgo: false

# HTML压缩配置
html_minifier:
  enable: true
  ignore_error: false
  silent: false

# CSS压缩配置
css_minifier:
  enable: true
  silent: false

# JavaScript压缩配置
js_minifier:
  enable: true
  mangle: true
  silent: false

# ==========================================
# 扩展配置
# ==========================================
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: maple

# ==========================================
# Stylus 配置
# ==========================================
stylus:
  compress: true  # CSS压缩

# ==========================================
# 部署配置
# ==========================================
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
- type: git
  repo:
      github: git@github.com:williamxiewz/williamxiewz.github.io.git,gh-pages
